- name: calculator_agent
  role: Math Assistant
  instructions: You are a helpful math assistant that can perform calculations using MCP tools.
  provider: openai
  model: gpt-4.1-mini
  tools: []
  mcp_servers:
    math:
      transport: streamable_http
      url: http://127.0.0.1:8000/mcp
